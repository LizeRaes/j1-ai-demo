server:
  port: 8082
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/static"
          welcome: "index.html"

langchain4j:
  embedding-stores:
    oracle-embedding-store:
      provider: oracle
      data-source:
        service-registry.named: "ora-ucp-ds"
      vector-index-create-option: CREATE_IF_NOT_EXISTS
      ivf-index:
        - name: TICKET_EMBEDDINGS_IVF
          create-option: CREATE_IF_NOT_EXISTS
          neighbor-partitions: 2
          sample-per-partition: 256
          min-vectors-per-partition: 64
          target-accuracy: 90
          degree-of-parallelism: 2
      embedding-table:
        name: TICKET_EMBEDDINGS
        id-column: ID
        embedding-column: EMBEDDING
        text-column: TEXT
        metadata-column: METADATA
        create-option: CREATE_IF_NOT_EXISTS

data:
  sources:
    sql:
      - name: "ora-ucp-ds"
        provider:
          ucp:
            username: "vector"
            password: "vector"
            url: "jdbc:oracle:thin:@localhost:1521/freepdb1"
            connection-factory-class-name: "oracle.jdbc.pool.OracleDataSource"
            properties:
              oracle.jdbc.vectorDefaultGetObjectType: "FLOAT_ARRAY"

similar-tickets:
  embedding:
    provider: "${SIMILAR_TICKETS_EMBEDDING_PROVIDER:oci}"
    openai:
      api-key: "${OPENAI_API_KEY:}"
      model-name: "text-embedding-3-large"
    oci:
      auth-method: "api_key"
      config-file: "~/.oci/config"
      profile: "DEFAULT"
      compartment-id: "${OCI_COMPARTMENT_ID:}"
      model-id: "${OCI_EMBEDDING_MODEL_ID:cohere.embed-english-v3.0}"
      region: "${OCI_GENAI_REGION:us-chicago-1}"
      serving-type: "ON_DEMAND"

ui:
  font:
    zoom:
      default: 100
